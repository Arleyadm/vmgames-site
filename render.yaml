services:
  - type: web
    name: vmgames-interacoes
    runtime: node
    plan: free
    rootDir: interacoes-api
    buildCommand: pnpm install --frozen-lockfile
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: HASH_SECRET
        generateValue: true
