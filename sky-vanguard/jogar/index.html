<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Sky Vanguard: Global Assault</title>

    <!-- AdSense: anúncios laterais (computador) e anúncio premiado do
         H5 Games Ads. O data-ad-frequency-hint é exigência da Ad Placement
         API e limita a frequência dos anúncios entre partidas. -->
    <script async data-ad-frequency-hint="30s"
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8110755806771816"
            crossorigin="anonymous"></script>
    <script>
        // A Ad Placement API funciona empurrando objetos para a fila do
        // AdSense; adBreak e adConfig são definidos aqui, pela página.
        window.adsbygoogle = window.adsbygoogle || [];
        window.adBreak = window.adConfig = function (o) { window.adsbygoogle.push(o); };
        window.adConfig({ preloadAdBreaks: 'on', sound: 'on' });
    </script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #05070f;
            overflow: hidden;
            /* Sem realce azul de toque nem seleção acidental no celular. */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* ⚠️ NÃO colocar position/transform aqui. O gdx-teavm descobre onde o
           canvas começa na página subindo pelos offsetParent, e um elemento
           posicionado vira o offsetParent do canvas, zerando o offsetLeft —
           aí o jogo recebe o X da janela em vez do X dentro do canvas e
           nenhum clique acerta os botões no computador (no celular passa
           batido, porque lá o canvas começa em zero). */
        #frame {
            aspect-ratio: 9 / 16;
            height: 100vh;
            height: 100dvh;
            max-width: 100vw;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            /* Impede o navegador de rolar/dar zoom quando o dedo arrasta. */
            touch-action: none;
        }

        /* Trilhos de anúncio, um de cada lado, dentro da tarja preta que sobra
           no computador. Ficam FORA da área de jogo de propósito: anúncio
           colado no controle vira clique sem querer — e isso é violação de
           política do AdSense, além de irritante. */
        .trilho {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 600px;
            display: none;
            z-index: 1;
        }
        .trilho.esquerda { left: 24px; }
        .trilho.direita { right: 24px; }
        /* Só aparecem quando sobra faixa preta de verdade dos dois lados.
           A caixa do jogo tem 9:16, então numa janela de 1280x800 ela ocupa
           450 px e sobram ~415 de cada lado. Abaixo disso (ou numa janela
           baixa) o anúncio some em vez de espremer o jogo. */
        @media (min-width: 1280px) and (min-height: 620px) {
            .trilho { display: block; }
        }

        /* Link de volta para o site, na tarja preta ao lado do jogo. So
           aparece quando sobra margem (tela larga); no celular o jogo ocupa
           tudo e o link sumiria por cima da imagem. */
        #voltar {
            position: fixed;
            top: 14px;
            left: 16px;
            z-index: 2;
            display: none;
            color: #7b8aa6;
            font: 600 14px/1 system-ui, "Segoe UI", Roboto, sans-serif;
            letter-spacing: .04em;
            text-decoration: none;
        }
        #voltar:hover { color: #cfe2ff; }
        @media (min-aspect-ratio: 3/4) {
            #voltar { display: block; }
        }
    </style>
</head>
<body oncontextmenu="return false">
    <a id="voltar" href="/sky-vanguard/">&larr; VM GAMES</a>

    <aside class="trilho esquerda" aria-label="Publicidade">
        <ins class="adsbygoogle"
             style="display:block;width:300px;height:600px"
             data-ad-client="ca-pub-8110755806771816"
             data-ad-slot="5080893674"
             data-ad-format="auto"
             data-full-width-responsive="false"></ins>
    </aside>

    <div id="frame">
        <canvas id="canvas"></canvas>
    </div>

    <aside class="trilho direita" aria-label="Publicidade">
        <ins class="adsbygoogle"
             style="display:block;width:300px;height:600px"
             data-ad-client="ca-pub-8110755806771816"
             data-ad-slot="5080893674"
             data-ad-format="auto"
             data-full-width-responsive="false"></ins>
    </aside>

    <script>
        // Só pede os anúncios laterais quando eles estão realmente visíveis.
        // Pedir com o trilho em display:none faz o AdSense registrar um espaço
        // de tamanho zero e não preencher mais nada naquela sessão.
        window.addEventListener("load", function () {
            document.querySelectorAll(".trilho").forEach(function (trilho) {
                if (getComputedStyle(trilho).display !== "none") {
                    (window.adsbygoogle = window.adsbygoogle || []).push({});
                }
            });
            main();
        });
    </script>
    <script type="text/javascript" charset="utf-8" src="app.js?v=b86865179c"></script>
</body>
</html>
