{% macro painel(chave) -%}
<section class="interacoes" data-interacoes="{{ chave }}" aria-labelledby="titulo-interacoes">
  <div class="interacoes-acoes"><h2 id="titulo-interacoes">Participe</h2><button class="acao-social curtir" type="button" data-curtir aria-pressed="false"><span aria-hidden="true">♥</span> Curtir <strong data-curtidas>0</strong></button><button class="acao-social" type="button" data-compartilhar-nativo>Compartilhar</button></div>
  <div class="comentarios-bloco"><h2>Comentários</h2><form class="comentario-form" data-comentario-form><div class="campo-isca" aria-hidden="true"><label>Site <input name="website" tabindex="-1" autocomplete="off"></label></div><label>Seu nome <input name="name" minlength="2" maxlength="50" autocomplete="name" required></label><label>Comentário <textarea name="body" minlength="3" maxlength="1000" rows="5" required></textarea></label><div class="comentario-envio"><button class="botao destaque-cor" type="submit">Publicar comentário</button><small>Respeite os outros leitores. Não publique dados pessoais.</small></div></form><p class="comentario-status" data-comentario-status role="status" aria-live="polite"></p><div class="comentarios-lista" data-comentarios aria-live="polite"><p>Carregando comentários…</p></div></div>
</section>
{%- endmacro %}
